[project]
name = "multivoice-reader"
version = "0.1.0"
description = "小说朗读：自动分角色、选声音、带情绪，全部在本机运行"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mlx-audio",
    "mlx-lm",
    "numpy",
    "scipy",
    "soundfile",
]

[project.scripts]
mvr = "multivoice_reader.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multivoice_reader"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# Prompts are written out as the model reads them.
"src/multivoice_reader/analyze.py" = ["E501"]
# Sample lines are written out as they are read.
"src/multivoice_reader/voices.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
